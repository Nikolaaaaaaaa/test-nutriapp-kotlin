# Gradle 9.x mora da se pokrene na JDK 17+, a na ovoj masini je na PATH-u JDK 8.
# Zato projekat ovde pokazuje na svoj JDK 21 — globalni JAVA_HOME se ne dira,
# pa nista drugo na masini ne puca. Kose crte su unapred: u .properties fajlu je
# obrnuta kosa crta escape karakter.
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.8-hotspot

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official
